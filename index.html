<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="QR code component built with semantic HTML and CSS as part of a Frontend Mentor challenge.">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <!-- Outfit: la tipografía del diseño (pesos 400 y 700) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css">

  <title>Frontend Mentor | QR code component</title>
</head>
<body>

  <!-- Contenido principal de la página -->
  <main>
    <!-- La tarjeta es una pieza de contenido autocontenida -->
    <article class="card">
      <img
        class="card__image"
        src="./images/image-qr-code.png"
        alt="QR code that links to the Frontend Mentor website"
        width="288"
        height="288"
      >

      <div class="card__content">
        <h1 class="card__title">Improve your front-end skills by building projects</h1>
        <p class="card__text">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
      </div>
    </article>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener noreferrer">Frontend Mentor</a>.
    Coded by <a href="https://github.com/vicxxsotop-rgb" target="_blank" rel="noopener noreferrer">Victor</a>.
  </footer>

</body>
</html>
